    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        h1 { font-size: 3rem; font-weight: 700; margin-bottom: 0.5rem; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        h1 { animation: fadeInUp 1s ease forwards; }

        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        nav button {
            padding: 12px 28px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
        }
        nav button:hover { background: rgba(255,255,255,0.3); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        nav button.active { background: white; color: #667eea; }

        .container { max-width: 1200px; margin: 0 auto; padding: 4rem 2rem; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; }

        .service {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.6s ease;
            position: relative;
            overflow: hidden;
        }
        .service.visible { opacity: 2; transform: translateY(0); }
        .service::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 300% 300%;
            animation: gradientShift 4s ease infinite;
        }
        @keyframes gradientShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .service-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }
        .service h2 {
            font-size: 1.6rem;
            color: #2d3748;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .service p {
            line-height: 1.8;
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }
        .highlight { color: #667eea; font-weight: 600; }

        .cta-button {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102,126,234,0.6);
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(0,0,0,0.15);
            color: white;
            backdrop-filter: blur(20px);
        }
        .scroll-indicator {
            position: fixed;
            top: 0; left: 0;
            width: 0%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #f093fb);
            z-index: 9999;
            transition: width 0.2s ease;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.3rem; }
            .services-grid { grid-template-columns: 1fr; }
            .container { padding: 2rem 1rem; }
        }
    </style>
</head>

        }, { threshold: 0.1 });
