<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Қызметтер - Керемет Қызметтер</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Scroll progress */
        .scroll-indicator {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            z-index: 9999;
            width: 0%;
            transition: width 0.15s ease;
        }

        /* Header */
        header {
            text-align: center;
            padding: 3.5rem 1.5rem 2rem;
            position: relative;
        }

        header h1 {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.75rem;
            background: linear-gradient(90deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 1.75rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.25rem;
            margin-top: 1rem;
        }

        .social-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 1.1rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            transition: all 0.25s ease;
        }

        .social-links a:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        /* Language switcher */
        nav {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin: 1.5rem 0 2.5rem;
        }

        nav button {
            padding: 0.6rem 1.4rem;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            border-radius: 999px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        nav button:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }

        nav button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        /* Radio player */
        .radio-player {
            max-width: 420px;
            margin: 0 auto 3rem;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .radio-player h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.9rem;
            color: #e0e7ff;
        }

        .radio-player audio {
            width: 100%;
            height: 40px;
            border-radius: 10px;
        }

        /* Container */
        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        /* Services grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.75rem;
        }

        .service {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.85rem;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .service.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .service:hover {
            transform: translateY(-6px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.11);
        }

        .service::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            opacity: 0.85;
        }

        .service-icon {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin-bottom: 1.25rem;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }

        .service h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.85rem;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .service p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .highlight {
            color: #a5b4fc;
            font-weight: 500;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem 1rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer a {
            color: #a5b4fc;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .services-grid {
                grid-template-columns: 1fr;
            }
            header {
                padding-top: 2.5rem;
            }
        }
    </style>
</head>

        window.addEventListener('DOMContentLoaded', () => changeLanguage('kk'));

            const percent = (window.scrollY / (document.body.offsetHeight - window.innerHeight)) * 100;
            document.getElementById('scrollIndicator').style.width = percent + '%';
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) e.target.classList.add('visible');
            });
        }, { threshold: 0.12 });

        document.querySelectorAll('.service').forEach(s => observer.observe(s));

        function changeLanguage(lang) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

            document.documentElement.lang = lang;
        }
